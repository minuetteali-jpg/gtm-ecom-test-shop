<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Test Shop | Cart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Google Tag Manager -->
  <script>
    (function(w,d,s,l,i){
      w[l]=w[l]||[];
      w[l].push({'gtm.start': new Date().getTime(),event:'gtm.js'});
      var f=d.getElementsByTagName(s)[0],
          j=d.createElement(s),
          dl=l!='dataLayer'?'&l='+l:'';
      j.async=true;
      j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;
      f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-N2T4MS7M');
  </script>
  <!-- End Google Tag Manager -->

  <link rel="stylesheet" href="assets/styles.css?v=2">
  <script src="assets/app.js?v=2"></script>
</head>

<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript>
    <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N2T4MS7M"
            height="0" width="0" style="display:none;visibility:hidden"></iframe>
  </noscript>

  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="index.html"><span class="brand-mark">TS</span>Test Shop</a>
      <a class="cart-link" href="cart.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
        Cart
        <span class="cart-count" data-cart-count hidden>0</span>
      </a>
    </div>
  </header>

  <main class="wrap">
    <a class="back-link" href="index.html">&larr; Continue shopping</a>

    <div class="intro">
      <h1>Your cart</h1>
    </div>

    <div id="cartWrap"></div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span class="badge" id="modeBadge" data-source-badge></span>
    </div>
  </footer>

  <script>
    const wrap = document.getElementById("cartWrap");

    function renderCart() {
      const { cart, value } = Shop.cartTotals();

      if (!cart.length) {
        wrap.className = "";
        wrap.innerHTML = `
          <div class="panel empty">
            <h2>Your cart is empty</h2>
            <a class="btn" href="index.html">Browse T-shirts</a>
          </div>`;
        return;
      }

      const lines = cart.map(x => {
        const p = Shop.getProduct(x.item_id) || {};
        const key = Shop.escapeHtml(x.key);
        const name = Shop.escapeHtml(x.item_name);
        return `
          <li class="line">
            <div class="line-thumb" style="background:${p.tint || "#eee"}">${p.item_id ? Shop.teeSvg(p) : ""}</div>
            <div>
              <div class="line-name">${name}</div>
              <div class="muted">Size ${Shop.escapeHtml(x.item_variant)} &middot; ${Shop.escapeHtml(x.item_id)}</div>
            </div>
            <div class="line-total">A$${Shop.formatMoney(x.price * x.quantity)}</div>
            <div class="line-controls">
              <div class="stepper">
                <button type="button" data-action="decrease" data-key="${key}" aria-label="Decrease quantity of ${name}">&minus;</button>
                <output aria-label="Quantity">${x.quantity}</output>
                <button type="button" data-action="increase" data-key="${key}" aria-label="Increase quantity of ${name}">+</button>
              </div>
              <button type="button" class="text-btn" data-action="remove" data-key="${key}">Remove</button>
            </div>
          </li>`;
      }).join("");

      wrap.className = "layout";
      wrap.innerHTML = `
        <div class="panel"><ul class="lines">${lines}</ul></div>
        <div class="panel">
          <h2>Summary</h2>
          <div class="summary-row" style="margin-top:10px;"><span>Subtotal</span><span>A$${Shop.formatMoney(value)}</span></div>
          <div class="summary-row"><span>Shipping</span><span>Free</span></div>
          <div class="summary-row total"><span>Cart value</span><span>A$${Shop.formatMoney(value)}</span></div>
          <button class="btn block" id="checkoutBtn">Begin checkout</button>
          <button type="button" class="text-btn" id="clearBtn">Clear cart</button>
        </div>`;
    }

    renderCart();

    // view_cart on every page load, with the cart contents
    (function () {
      const { cart, value } = Shop.cartTotals();
      Shop.pushEcomEvent("view_cart", {
        currency: "AUD",
        value: value,
        items: cart.map(x => Shop.toEcomItem(x))
      });
    })();

    function pushRemove(lines) {
      Shop.pushEcomEvent("remove_from_cart", {
        currency: "AUD",
        value: Shop.round2(lines.reduce((sum, l) => sum + l.item.price * l.quantity, 0)),
        items: lines.map(l => Shop.toEcomItem(l.item, l.quantity))
      });
    }

    wrap.addEventListener("click", function (e) {
      const btn = e.target.closest("button");
      if (!btn) return;

      const action = btn.getAttribute("data-action");
      const key = btn.getAttribute("data-key");

      if (action === "increase") {
        const line = Shop.changeQuantity(key, 1);
        if (!line) return;
        Shop.pushEcomEvent("add_to_cart", {
          currency: "AUD",
          value: line.price,
          items: [Shop.toEcomItem(line, 1)]
        });
        renderCart();

      } else if (action === "decrease") {
        const line = Shop.changeQuantity(key, -1);
        if (!line) return;
        pushRemove([{ item: line, quantity: 1 }]);
        renderCart();
        if (line.quantity === 1) Shop.toast("Removed: " + line.item_name);

      } else if (action === "remove") {
        const line = Shop.removeFromCart(key);
        if (!line) return;
        pushRemove([{ item: line, quantity: line.quantity }]);
        renderCart();
        Shop.toast("Removed: " + line.item_name);

      } else if (btn.id === "clearBtn") {
        const { cart } = Shop.cartTotals();
        if (!cart.length) return;
        Shop.clearCart();
        pushRemove(cart.map(x => ({ item: x, quantity: x.quantity })));
        renderCart();
        Shop.toast("Cart cleared");

      } else if (btn.id === "checkoutBtn") {
        const { cart, value } = Shop.cartTotals();
        if (!cart.length) return;
        btn.disabled = true;
        Shop.pushEcomEvent("begin_checkout", {
          currency: "AUD",
          value: value,
          items: cart.map(x => Shop.toEcomItem(x))
        }, function () {
          Shop.go("checkout.html");
        });
      }
    });

    // Re-enable the checkout button if the visitor comes back with the back button
    window.addEventListener("pageshow", function (e) {
      if (e.persisted) renderCart();
    });
  </script>
</body>
</html>
