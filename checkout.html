<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Test Shop | Checkout</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- GTM -->
  <script>
    (function(w,d,s,l,i){
      w[l]=w[l]||[];
      w[l].push({'gtm.start': new Date().getTime(),event:'gtm.js'});
      var f=d.getElementsByTagName(s)[0],
          j=d.createElement(s),
          dl=l!='dataLayer'?'&l='+l:'';
      j.async=true;
      j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;
      f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-N2T4MS7M');
  </script>

  <link rel="stylesheet" href="assets/styles.css">
  <script src="assets/app.js"></script>
</head>

<body>
  <noscript>
    <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N2T4MS7M"
            height="0" width="0" style="display:none;visibility:hidden"></iframe>
  </noscript>

  <header>
    <div class="actions">
      <a class="btn ghost" href="cart.html">← Back to cart</a>
    </div>
  </header>

  <h1>Checkout (fake)</h1>
  <div class="notice">Click “Place order” to fire <strong>purchase</strong>.</div>

  <div class="card">
    <div id="summary"></div>
    <div class="actions" style="margin-top:12px;">
      <button class="btn" id="purchaseBtn">Place order (purchase)</button>
    </div>
  </div>

<footer>
    <div class="container" style="text-align: center; padding: 20px; border-top: 1px solid #eee; margin-top: 20px;">
        <span class="badge" id="modeBadge"></span>
    </div>
</footer>

  <script>
    document.getElementById("modeBadge").textContent = "source: " + Shop.getSource();

    const { cart, value } = Shop.cartTotals();

    const summary = document.getElementById("summary");
    const purchaseBtn = document.getElementById("purchaseBtn");

    if (!cart.length) {
      summary.innerHTML = `<div class="notice">Cart is empty. Go back and add items.</div>`;
      purchaseBtn.disabled = true;
    } else {
      summary.innerHTML = `
        <div><strong>Order total:</strong> AUD ${Shop.formatMoney(value)}</div>
        <div class="muted" style="margin-top:6px;">
          Items: ${cart.map(x => `${x.item_name} (${x.item_variant}) x${x.quantity}`).join(", ")}
        </div>
      `;
    }

    function itemsForEcom() {
      return cart.map(x => ({
        item_id: x.item_id,
        item_name: x.item_name,
        item_category: x.item_category,
        item_variant: x.item_variant,
        price: x.price,
        quantity: x.quantity
      }));
    }

    purchaseBtn.addEventListener("click", function () {
      if (!cart.length) return;

      const transactionId = "T" + Date.now();

      Shop.pushEcomEvent("purchase", {
        transaction_id: transactionId,
        currency: "AUD",
        value: value,
        tax: 0,
        shipping: 0,
        items: itemsForEcom()
      });

      // Clear cart after purchase
      Shop.clearCart();

      alert("purchase fired. transaction_id=" + transactionId);
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
