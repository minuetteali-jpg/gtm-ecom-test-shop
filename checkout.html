<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Test Shop | Checkout</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- GTM -->
  <script>
    (function(w,d,s,l,i){
      w[l]=w[l]||[];
      w[l].push({'gtm.start': new Date().getTime(),event:'gtm.js'});
      var f=d.getElementsByTagName(s)[0],
          j=d.createElement(s),
          dl=l!='dataLayer'?'&l='+l:'';
      j.async=true;
      j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;
      f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-N2T4MS7M');
  </script>

 <link rel="stylesheet" href="assets/styles.css">
<script src="assets/app.js"></script>

</head>

<body>
  <noscript>
    <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N2T4MS7M"
            height="0" width="0" style="display:none;visibility:hidden"></iframe>
  </noscript>

  <header>
    <div class="actions">
      <a class="btn ghost" href="/cart.html">← Back to cart</a>
      <span class="badge" id="modeBadge"></span>
    </div>
  </header>

  <h1>Checkout (fake)</h1>
  <div class="notice">Use the buttons to fire shipping/payment events. Then place the order to fire <strong>purchase</strong>.</div>

  <div class="card">
    <div id="summary"></div>
    <div class="actions" style="margin-top:12px;">
      <button class="btn ghost" id="shipBtn">Add shipping info</button>
      <button class="btn ghost" id="payBtn">Add payment info</button>
      <button class="btn" id="purchaseBtn">Place order (purchase)</button>
    </div>
  </div>

  <script>
    document.getElementById("modeBadge").textContent = "source: " + Shop.getSource();

    const { cart, value } = Shop.cartTotals();

    const summary = document.getElementById("summary");
    if (!cart.length) {
      summary.innerHTML = `<div class="notice">Cart is empty. Go back and add items.</div>`;
      document.getElementById("purchaseBtn").disabled = true;
      document.getElementById("shipBtn").disabled = true;
      document.getElementById("payBtn").disabled = true;
    } else {
      summary.innerHTML = `
        <div><strong>Order total:</strong> AUD ${Shop.formatMoney(value)}</div>
        <div class="muted" style="margin-top:6px;">Items: ${cart.map(x => `${x.item_name} (${x.item_variant}) x${x.quantity}`).join(", ")}</div>
      `;
    }

    function itemsForEcom() {
      return cart.map(x => ({
        item_id: x.item_id,
        item_name: x.item_name,
        item_category: x.item_category,
        item_variant: x.item_variant,
        price: x.price,
        quantity: x.quantity
      }));
    }

    document.getElementById("shipBtn").addEventListener("click", function () {
      if (!cart.length) return;
      Shop.pushEcomEvent("add_shipping_info", {
        currency: "AUD",
        value: value,
        shipping_tier: "Standard",
        items: itemsForEcom()
      });
      alert("add_shipping_info fired");
    });

    document.getElementById("payBtn").addEventListener("click", function () {
      if (!cart.length) return;
      Shop.pushEcomEvent("add_payment_info", {
        currency: "AUD",
        value: value,
        payment_type: "Card",
        items: itemsForEcom()
      });
      alert("add_payment_info fired");
    });

    document.getElementById("purchaseBtn").addEventListener("click", function () {
      if (!cart.length) return;

      const transactionId = "T" + Date.now();

      Shop.pushEcomEvent("purchase", {
        transaction_id: transactionId,
        currency: "AUD",
        value: value,
        tax: 0,
        shipping: 0,
        items: itemsForEcom()
      });

      // Clear cart after purchase
      Shop.clearCart();

      alert("purchase fired. transaction_id=" + transactionId);
      window.location.href = "/index.html";
    });
  </script>
</body>
</html>
