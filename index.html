<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Test Shop | T-Shirts</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Google Tag Manager -->
  <script>
    (function(w,d,s,l,i){
      w[l]=w[l]||[];
      w[l].push({'gtm.start': new Date().getTime(),event:'gtm.js'});
      var f=d.getElementsByTagName(s)[0],
          j=d.createElement(s),
          dl=l!='dataLayer'?'&l='+l:'';
      j.async=true;
      j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;
      f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-N2T4MS7M');
  </script>
  <!-- End Google Tag Manager -->

  <link rel="stylesheet" href="assets/styles.css?v=2">
  <script src="assets/app.js?v=2"></script>
</head>

<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript>
    <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N2T4MS7M"
            height="0" width="0" style="display:none;visibility:hidden"></iframe>
  </noscript>

  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="index.html"><span class="brand-mark">TS</span>Test Shop</a>
      <a class="cart-link" href="cart.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
        Cart
        <span class="cart-count" data-cart-count hidden>0</span>
      </a>
    </div>
  </header>

  <main class="wrap">
    <div class="intro">
      <h1>T-Shirts</h1>
      <p>Simple T-shirt site for testing.</p>
    </div>

    <div class="grid" id="productGrid"></div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span class="badge" id="modeBadge" data-source-badge></span>
    </div>
  </footer>

  <script>
    const grid = document.getElementById("productGrid");

    Shop.CATALOG.forEach(p => {
      const href = "product.html?id=" + encodeURIComponent(p.item_id);
      const sizeId = "size_" + p.item_id;
      const el = document.createElement("article");
      el.className = "card";
      el.innerHTML = `
        <a class="card-media" href="${href}" style="background:${p.tint}" tabindex="-1" aria-hidden="true">${Shop.teeSvg(p)}</a>
        <div class="card-body">
          <h2><a class="card-title" href="${href}">${Shop.escapeHtml(p.item_name)}</a></h2>
          <div class="price">A$${Shop.formatMoney(p.price)}</div>
          <div class="field-row">
            <label for="${sizeId}">Size</label>
            <select id="${sizeId}" data-size-for="${p.item_id}">
              ${Shop.SIZES.map(s => `<option value="${s}"${s === Shop.DEFAULT_SIZE ? " selected" : ""}>${s}</option>`).join("")}
            </select>
          </div>
          <div class="actions">
            <button class="btn" data-id="${p.item_id}">Add to cart</button>
            <a class="btn ghost" href="${href}">View details</a>
          </div>
        </div>
      `;
      grid.appendChild(el);
    });

    // view_item_list on every page load
    Shop.pushEcomEvent("view_item_list", {
      item_list_id: "tshirts_list",
      item_list_name: "T-Shirts",
      items: Shop.CATALOG.map((p, idx) => ({
        item_id: p.item_id,
        item_name: p.item_name,
        item_category: p.item_category,
        index: idx + 1,
        price: p.price,
        quantity: 1
      }))
    });

    // Add-to-cart buttons
    grid.addEventListener("click", function (e) {
      const btn = e.target.closest("button[data-id]");
      if (!btn) return;

      const itemId = btn.getAttribute("data-id");
      const sizeSelect = grid.querySelector('select[data-size-for="' + itemId + '"]');
      const variant = sizeSelect ? sizeSelect.value : Shop.DEFAULT_SIZE;
      const qty = 1;

      const p = Shop.getProduct(itemId);
      Shop.addToCart(itemId, variant, qty);

      Shop.pushEcomEvent("add_to_cart", {
        currency: "AUD",
        value: Shop.round2(p.price * qty),
        items: [{
          item_id: p.item_id,
          item_name: p.item_name,
          item_category: p.item_category,
          item_variant: variant,
          price: p.price,
          quantity: qty
        }]
      });

      Shop.toast("Added: " + p.item_name + " (" + variant + ")", "View cart", "cart.html");
    });
  </script>
</body>
</html>
